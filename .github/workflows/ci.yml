name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SecretWorkbench.slnx
      - run: dotnet test SecretWorkbench.slnx --no-restore --configuration Release
      - run: dotnet pack SecretWorkbench/SecretWorkbench.csproj --no-restore --no-build --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg
