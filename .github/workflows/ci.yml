name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore SecretWorkbench.slnx
      - run: dotnet test SecretWorkbench.slnx --no-restore --configuration Release
      - run: dotnet pack SecretWorkbench/SecretWorkbench.csproj --no-restore --configuration Release
      - name: Smoke-test each tool framework
        shell: bash
        run: |
          package="$(ls artifacts/packages/SecretWorkbench.*.nupkg)"
          version="$(basename "$package" .nupkg)"
          version="${version#SecretWorkbench.}"
          scripts/smoke-test.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg
