name: Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 0.1.0 or 0.2.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, pack, and publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SecretWorkbench.slnx

      - name: Test
        run: dotnet test SecretWorkbench.slnx --no-restore --configuration Release

      - name: Pack
        run: >-
          dotnet pack SecretWorkbench/SecretWorkbench.csproj
          --no-restore
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Smoke-test each tool framework
        run: scripts/smoke-test.sh "${{ steps.version.outputs.value }}"

      - name: Preserve package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecretWorkbench-${{ steps.version.outputs.value }}
          path: artifacts/packages/SecretWorkbench.${{ steps.version.outputs.value }}.nupkg
          if-no-files-found: error

      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >-
          dotnet nuget push
          artifacts/packages/SecretWorkbench.${{ steps.version.outputs.value }}.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
